services:
  - type: web
    name: sebastian-portfolio
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run deploy:check && npm run build -- --webpack
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: CONTACT_RATE_LIMIT_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_ANALYTICS_ENABLED
        value: 'false'
